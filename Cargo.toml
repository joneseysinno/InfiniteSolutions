[workspace]
resolver = "3"
members = [
    "crates/infinite-runtime",
    "crates/infinite-compositor",
    "crates/infinite-presenter",
    "crates/infinite-db",
]

[workspace.package]
edition = "2024"
rust-version = "1.94"
license = "MIT"
publish = false

[dependencies]
# The facade names the layer crates. The editor and the portal do not (D32, R2).
#
# infinite-db is the vendored copy (D32). Switch to the published 0.4.x crate when
# the facade needs no store change for two consecutive stages.
infinite-runtime = { path = "crates/infinite-runtime", features = ["binding"] }
infinite-compositor = { path = "crates/infinite-compositor", features = ["binding"] }
infinite-presenter = { path = "crates/infinite-presenter", features = ["binding"] }
infinite-db = { path = "crates/infinite-db" }
winit = "0.30.13"
# wgpu 30's gpu-allocator accepts windows 0.53–0.62. The lockfile must keep
# a single 0.62 line or DX12 fails to compile (two windows crate majors).
wgpu = "30"
# Adapter and device requests are futures. They are awaited exactly twice, both
# times at window creation (D42) — never on the tick path, which R8 and L1 forbid
# and `check-rules.sh` greps `portal/drive.rs` for.
pollster = "0.4"

[dev-dependencies]
tempfile = "3"
